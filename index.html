<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sans Exp Store</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at top,#24204a 0%,#0b0b12 45%,#07070b 100%);
    color:white;
    min-height:100vh;
}

/* HEADER */

header{
    text-align:center;
    padding:35px 20px 25px;
}

.logo{
    width:90px;
    height:90px;
    margin:auto;
    border-radius:25px;
    background:linear-gradient(135deg,#7c4dff,#b026ff);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
    font-weight:bold;
    box-shadow:0 0 30px #7c4dff66;
}

.logo span{
    color:white;
}

h1{
    margin-top:15px;
    font-size:30px;
}

h1 span{
    color:#9b7aff;
}

.subtitle{
    color:#9b9baa;
    margin-top:7px;
}

/* GAME */

.container{
    width:92%;
    max-width:800px;
    margin:auto;
}

.games{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
    margin-top:30px;
}

.game{
    background:#15151f;
    border:1px solid #29293a;
    border-radius:20px;
    padding:28px 18px;
    text-align:center;
    box-shadow:0 10px 30px #00000030;
}

.game:hover{
    border-color:#8b65ff;
}

.icon{
    font-size:55px;
    margin-bottom:12px;
}

.game h2{
    margin-bottom:8px;
}

.game p{
    color:#9999a8;
    font-size:14px;
    margin-bottom:18px;
}

.button{
    display:inline-block;
    background:#7957ff;
    color:white;
    text-decoration:none;
    padding:11px 20px;
    border-radius:10px;
    font-weight:bold;
}

/* ROBLOX TENGAH */

.roblox{
    max-width:390px;
    margin:18px auto 0;
}

/* ADMIN */

.admin{
    text-align:center;
    margin-top:45px;
    padding:25px 15px;
    border-top:1px solid #29293a;
    background:#0e0e15;
}

.admin-title{
    color:#9999a8;
    font-size:13px;
    margin-bottom:8px;
}

.admin-number{
    font-size:20px;
    font-weight:bold;
    color:#9b7aff;
}

.wa{
    display:inline-block;
    margin-top:12px;
    background:#20b958;
    color:white;
    padding:10px 20px;
    border-radius:10px;
    text-decoration:none;
    font-weight:bold;
}

footer{
    text-align:center;
    color:#555564;
    padding:20px;
    font-size:12px;
}

/* HP */

@media(max-width:600px){

    .games{
        grid-template-columns:1fr 1fr;
        gap:12px;
    }

    .game{
        padding:22px 10px;
    }

    .icon{
        font-size:45px;
    }

    .game h2{
        font-size:18px;
    }

    .game p{
        font-size:12px;
    }

    .button{
        padding:9px 12px;
        font-size:13px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        SX
    </div>

    <h1>SANS <span>EXP</span></h1>

    <p class="subtitle">
        Top Up Game Cepat & Murah
    </p>

</header>


<div class="container">

    <div class="games">

        <!-- FREE FIRE -->

        <div class="game">

            <div class="icon">🔥</div>

            <h2>Free Fire</h2>

            <p>Top Up Diamond FF</p>

            <a class="button" href="#freefire">
                Lihat Harga
            </a>

        </div>


        <!-- MOBILE LEGENDS -->

        <div class="game">

            <div class="icon">🎮</div>

            <h2>Mobile Legends</h2>

            <p>Top Up Diamond ML</p>

            <a class="button" href="#mobilelegends">
                Lihat Harga
            </a>

        </div>

    </div>


    <!-- ROBLOX DI TENGAH -->

    <div class="roblox">

        <div class="game">

            <div class="icon">🟥</div>

            <h2>Roblox</h2>

            <p>Top Up Robux</p>

            <a class="button" href="#roblox">
                Lihat Harga
            </a>

        </div>

    </div>

</div>


<!-- ADMIN -->

<div class="admin">

    <div class="admin-title">
        ADMIN / CUSTOMER SERVICE
    </div>

    <div class="admin-number">
        0882 0079 02763
    </div>

    <a
        class="wa"
        href="https://wa.me/62882007902763"
    >
        💬 Chat WhatsApp
    </a>

</div>


<footer>
    © 2026 Sans Exp Store
</footer>


</body>
</html>
